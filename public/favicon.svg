<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Main logo gradient: Purple to Pink -->
    <linearGradient id="logo-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <!-- Drop shadow for the main pin -->
    <filter id="logo-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Redesigned Outer Heart-Pin Border -->
  <path 
    d="M50,90 C30,72 12,50 12,32 C12,16 28,8 50,26 C72,8 88,16 88,32 C88,50 70,72 50,90 Z" 
    stroke="url(#logo-grad)" 
    stroke-width="6.5" 
    stroke-linecap="round" 
    stroke-linejoin="round"
    filter="url(#logo-shadow)"
  />

  <!-- Inner Heart Core -->
  <path 
    d="M50,60 C43,53 35,43 35,34 C35,27 40,22 50,30 C60,22 65,27 65,34 C65,43 57,53 50,60 Z" 
    fill="url(#logo-grad)" 
  />

  <!-- Sound Wave / Vibe Equalizer Bars (Left) -->
  <rect 
    x="25" 
    y="28" 
    width="4.5" 
    height="16" 
    rx="2.25" 
    fill="url(#logo-grad)" 
    opacity="0.8" 
  />
  <rect 
    x="17" 
    y="32" 
    width="4.5" 
    height="8" 
    rx="2.25" 
    fill="url(#logo-grad)" 
    opacity="0.5" 
  />

  <!-- Sound Wave / Vibe Equalizer Bars (Right) -->
  <rect 
    x="70.5" 
    y="28" 
    width="4.5" 
    height="16" 
    rx="2.25" 
    fill="url(#logo-grad)" 
    opacity="0.8" 
  />
  <rect 
    x="78.5" 
    y="32" 
    width="4.5" 
    height="8" 
    rx="2.25" 
    fill="url(#logo-grad)" 
    opacity="0.5" 
  />
</svg>